[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenkick"
version = "1.23.3"
description = "Automatically start Codex and Claude Code 5-hour usage windows on your schedule. Tracks 5-hour and weekly limits across accounts; local-first CLI, TUI, and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Paul Kahle" },
]
keywords = ["ai-coding", "claude", "claude-code", "cli", "codex", "codex-cli", "5-hour-limit", "usage-limits", "developer-tools", "mcp", "quota", "rate-limit", "scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "InquirerPy>=0.3.4",
    "prompt_toolkit>=3.0",
    "mcp>=1.9,<2",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
notify = ["httpx"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    # Keep the audited lint policy reproducible; upgrade in a reviewed tooling change.
    "ruff==0.15.20",
]

[project.scripts]
tk = "tokenkick.cli:cli"
tokenkick = "tokenkick.cli:cli"
tk-mcp = "tokenkick.mcp_server:main"

[project.urls]
Homepage = "https://www.tokenkick.dev"
Documentation = "https://github.com/noriworks/tokenkick#readme"
Repository = "https://github.com/noriworks/tokenkick"
Changelog = "https://github.com/noriworks/tokenkick/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/noriworks/tokenkick/issues"
Security = "https://github.com/noriworks/tokenkick/security/policy"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel.force-include]
"docs/AGENT_PLAYBOOK.md" = "tokenkick/resources/AGENT_PLAYBOOK.md"
"docs/TOKENKICK_COMMANDS.md" = "tokenkick/resources/TOKENKICK_COMMANDS.md"
