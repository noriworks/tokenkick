name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m build
      - run: python scripts/verify-package-resources.py --wheel dist/*.whl
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: scripts/build-bundled-tk.sh
      - run: .venv/bin/python -m pip install build
      - run: .venv/bin/python -m build
      - run: .venv/bin/python scripts/verify-package-resources.py --wheel dist/*.whl --runtime dist/tokenkick-runtime/tk
      - run: TK_BUNDLED_RUNTIME="$PWD/dist/tokenkick-runtime/tk" swift test --package-path macos/TokenKickKit
